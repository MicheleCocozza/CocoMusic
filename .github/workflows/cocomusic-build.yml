name: CocoMusic - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - README.md
      - fastlane/**
      - .github/**/*.md

permissions:
  contents: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Create local.properties
        run: |
          echo SENTRY_DSN= > ./local.properties
          echo SENTRY_AUTH_TOKEN= >> ./local.properties
          echo LASTFM_API_KEY= >> ./local.properties
          echo LASTFM_SECRET= >> ./local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoMusic-debug
          path: androidApp/build/outputs/apk/**/debug/*.apk
          retention-days: 30
