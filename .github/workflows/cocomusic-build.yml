name: CocoMusic - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - README.md
      - fastlane/**
      - .github/**/*.md

permissions:
  contents: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Create local.properties
        run: |
          echo SENTRY_DSN= > ./local.properties
          echo SENTRY_AUTH_TOKEN= >> ./local.properties
          echo LASTFM_API_KEY= >> ./local.properties
          echo LASTFM_SECRET= >> ./local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Setup stable signing keystore
        run: |
          base64 -d android/cocomusic-debug.keystore.b64 > /tmp/cocomusic-debug.keystore
          echo "KEYSTORE_PATH=/tmp/cocomusic-debug.keystore" >> $GITHUB_ENV
          echo "KEY_ALIAS=cocomusic" >> $GITHUB_ENV
          echo "KEY_PASSWORD=cocomusic" >> $GITHUB_ENV
          echo "STORE_PASSWORD=cocomusic" >> $GITHUB_ENV

      - name: Clean Gradle build cache
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*arm64*.apk dist/CocoMusic-arm64-v8a.apk || true
          cp androidApp/build/outputs/apk/debug/*universal*.apk dist/CocoMusic-universal.apk || true
          ls dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoMusic-debug
          path: dist/*.apk
          retention-days: 30

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | grep -oP '"[^"]+"' | tr -d '"')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CocoMusic ${{ steps.version.outputs.tag }}
          body: |
            Build automatico dal branch dev — CocoMusic ${{ steps.version.outputs.tag }}.
            Installa CocoMusic-arm64-v8a.apk su telefoni Android moderni (2016+).
          prerelease: false
          files: dist/*.apk
          make_latest: true
          overwrite: true
