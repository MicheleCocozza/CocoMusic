name: CocoMusic - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - README.md
      - fastlane/**
      - .github/**/*.md

permissions:
  contents: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Create local.properties
        run: |
          echo SENTRY_DSN= > ./local.properties
          echo SENTRY_AUTH_TOKEN= >> ./local.properties
          echo LASTFM_API_KEY= >> ./local.properties
          echo LASTFM_SECRET= >> ./local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Setup stable signing keystore
        run: |
          KEYSTORE_B64_FILE="android/cocomusic-debug.keystore.b64"
          KEYSTORE_FILE="/tmp/cocomusic-debug.keystore"
          mkdir -p android
          if [ -f "$KEYSTORE_B64_FILE" ]; then
            echo "Restoring existing keystore"
            base64 -d "$KEYSTORE_B64_FILE" > "$KEYSTORE_FILE"
          else
            echo "Generating new stable signing keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -alias cocomusic \
              -storepass cocomusic \
              -keypass cocomusic \
              -dname "CN=CocoMusic, OU=Dev, O=CocoMusic, L=IT, ST=IT, C=IT"
            base64 -w 0 "$KEYSTORE_FILE" > "$KEYSTORE_B64_FILE"
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add "$KEYSTORE_B64_FILE"
            git commit -m "ci: add stable debug signing keystore for consistent installs"
            git push
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEY_ALIAS=cocomusic" >> $GITHUB_ENV
          echo "KEY_PASSWORD=cocomusic" >> $GITHUB_ENV
          echo "STORE_PASSWORD=cocomusic" >> $GITHUB_ENV

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/*arm64*.apk dist/CocoMusic-arm64-v8a.apk || true
          cp androidApp/build/outputs/apk/debug/*universal*.apk dist/CocoMusic-universal.apk || true
          ls dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CocoMusic-debug
          path: dist/*.apk
          retention-days: 30

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: CocoMusic - Latest Debug Build
          body: |
            Build automatico dal branch dev.
            Installa CocoMusic-arm64-v8a.apk su telefoni Android moderni (2016+).
          prerelease: true
          files: dist/*.apk
          make_latest: false
