name: Build release APK (FOSS)
on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Update Sentry Secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}' > ./local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> ./local.properties

      - name: Update Last.fm secrets
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Setup signing keystore
        run: |
          base64 -d android/cocomusic-debug.keystore.b64 > /tmp/cocomusic-debug.keystore

      - name: Sign and zipalign release APK
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort | tail -n 1)
          echo "Using build-tools: $BUILD_TOOL_VERSION"
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION/apksigner"
          ZIPALIGN="/usr/local/lib/android/sdk/build-tools/$BUILD_TOOL_VERSION/zipalign"
          RELEASE_DIR="androidApp/build/outputs/apk/release"
          for APK in "$RELEASE_DIR"/*.apk; do
            [ -f "$APK" ] || continue
            ALIGNED="${APK%.apk}-aligned.apk"
            SIGNED="${APK%.apk}-signed.apk"
            "$ZIPALIGN" -v 4 "$APK" "$ALIGNED"
            "$APKSIGNER" sign               --ks /tmp/cocomusic-debug.keystore               --ks-key-alias cocomusic               --ks-pass pass:cocomusic               --key-pass pass:cocomusic               --out "$SIGNED"               "$ALIGNED"
            rm -f "$ALIGNED"
            echo "Signed: $SIGNED"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: androidApp/build/outputs/apk/release/*-signed.apk
